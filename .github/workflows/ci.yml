name: CI

# Separate from publish.yml on purpose: that one builds and pushes a Docker
# image, which is slow and only meaningful on main. This is the fast check
# that should gate every change, so it runs on pull requests too.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One red Node version should not hide the result on the others.
      fail-fast: false
      matrix:
        # 24 is the declared floor (engines.node) and Node's current Active
        # LTS; 26 is the Current line, which becomes LTS in October 2026.
        #
        # Testing both means a break on the line that is about to become the
        # recommended one surfaces here rather than on users after they
        # upgrade. That is exactly the class of bug this workflow found twice
        # on its first run, in the other direction: two Node-version
        # incompatibilities that had been invisible for lack of CI.
        node: ["24", "26"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` rather than `npm install`: it fails when package.json and
      # package-lock.json disagree, which is exactly the drift that would
      # otherwise reach main unnoticed.
      - run: npm ci

      # `npm test` builds first (tsc) and then runs node --test over dist/,
      # so this covers typechecking as well as the suite.
      - run: npm test
